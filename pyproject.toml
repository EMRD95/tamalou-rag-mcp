[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tamalou-rag-mcp"
version = "0.1.0"
description = "Modular RAG MCP server with PDF screenshots and pluggable loaders"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tamalou contributors"}]
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.scripts]
tamalou-ingest = "tamalou_rag.ingest:main"
tamalou-add = "tamalou_rag.add:main"
tamalou-remove = "tamalou_rag.remove:main"
tamalou-server = "tamalou_rag.server:run"
tamalou-mcp = "tamalou_rag.mcp_server:main"
tamalou-export = "tamalou_rag.bundle:export_main"
tamalou-import = "tamalou_rag.bundle:import_main"
tamalou-migrate = "tamalou_rag.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]
